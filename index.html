<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Asistencia QR - Privado</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 400px; margin: auto; border: 2px dashed #ccc; border-radius: 8px; }
        #resultado { margin-top: 20px; font-size: 1.2em; font-weight: bold; padding: 10px; }
        nav { margin-bottom: 20px; }
        nav a { margin: 0 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        
        /* Pantalla de bloqueo */
        #capa-seguridad { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .caja-login { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 15px rgba(0,0,0,0.2); text-align: center; }
        .caja-login input { padding: 10px; width: 200px; margin-bottom: 10px; text-align: center; font-size: 1em; }
        .caja-login button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="capa-seguridad">
        <div class="caja-login">
            <h3>🔑 Acceso Restringido</h3>
            <p>Introduce la clave de seguridad para activar el escáner:</p>
            <input type="password" id="clave-acceso" placeholder="Contraseña">
            <br>
            <button id="btn-verificar">Ingresar</button>
            <p id="error-validacion" style="color: red; display: none; font-weight: bold; margin-top: 10px;">⚠️ Clave Incorrecta</p>
        </div>
    </div>

    <div class="container">
        <nav>
            <a href="admin.html">Agregar Usuarios</a>
            <a href="informes.html">Ver Informes</a>
        </nav>
        <h1>Control de Asistencia</h1>
        <div id="reader"></div>
        <div id="resultado">Esperando escaneo...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // === TU CONFIGURACIÓN DE FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyCFFZvpTY292Ilq_vCGaSFOk4MNQersDtg",
  authDomain: "asistenciabifml.firebaseapp.com",
  databaseURL: "https://asistenciabifml-default-rtdb.firebaseio.com",
  projectId: "asistenciabifml",
  storageBucket: "asistenciabifml.firebasestorage.app",
  messagingSenderId: "831773431166",
  appId: "1:831773431166:web:90c37497734c43a84e8f2f",
  measurementId: "G-VVG07BDQGH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // === DEFINE TU CONTRASEÑA AQUÍ ===
        const CLAVE_CORRECTA = "ElvisPresley"; 

        document.getElementById('btn-verificar').addEventListener('click', () => {
            const claveIngresada = document.getElementById('clave-acceso').value;
            if (claveIngresada === CLAVE_CORRECTA) {
                // Desvanecer el muro de seguridad e iniciar el escáner
                document.getElementById('capa-seguridad').style.display = 'none';
                iniciarEscaner();
            } else {
                document.getElementById('error-validacion').style.display = 'block';
                document.getElementById('clave-acceso').value = '';
            }
        });

        // Lógica del escáner (protegida)
        let lastScan = "";
        async function onScanSuccess(decodedText) {
            if (decodedText === lastScan) return;
            lastScan = decodedText;
            
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerText = "Registrando asistencia...";

            try {
                await addDoc(collection(db, "asistencias"), {
                    usuarioId: decodedText,
                    timestamp: new Date()
                });
                resultadoDiv.style.color = "green";
                resultadoDiv.innerText = "¡Asistencia registrada!";
                setTimeout(() => { lastScan = ""; resultadoDiv.style.color = "#333"; resultadoDiv.innerText = "Esperando siguiente escaneo..."; }, 3000);
            } catch (e) {
                resultadoDiv.style.color = "red";
                resultadoDiv.innerText = "Error de conexión.";
                lastScan = "";
            }
        }

        function iniciarEscaner() {
            let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
            html5QrcodeScanner.render(onScanSuccess, (error) => {});
        }
    </script>
</body>
</html>
