<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Asistencia QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        #reader { width: 100%; max-width: 400px; margin: auto; border: 2px dashed #ccc; border-radius: 8px; overflow: hidden; }
        #resultado { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; padding: 10px; border-radius: 4px; }
        nav { margin-bottom: 20px; }
        nav a { margin: 0 15px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="admin.html">Agregar Usuarios</a>
            <a href="informes.html">Ver Informes</a>
        </nav>
        
        <h1>Control de Asistencia</h1>
        <div id="reader"></div>
        <div id="resultado">Esperando escaneo...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // === PEGA AQUÍ TUS MISMAS CREDENCIALES REALES DE FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyCFFZvpTY292Ilq_vCGaSFOk4MNQersDtg",
  authDomain: "asistenciabifml.firebaseapp.com",
  databaseURL: "https://asistenciabifml-default-rtdb.firebaseio.com",
  projectId: "asistenciabifml",
  storageBucket: "asistenciabifml.firebasestorage.app",
  messagingSenderId: "831773431166",
  appId: "1:831773431166:web:90c37497734c43a84e8f2f",
  measurementId: "G-VVG07BDQGH"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variable de control para evitar lecturas duplicadas continuas
        let lastScan = "";

        async function onScanSuccess(decodedText) {
            if (decodedText === lastScan) return;
            lastScan = decodedText;
            
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.style.backgroundColor = "#e6f2ff";
            resultadoDiv.style.color = "#007bff";
            resultadoDiv.innerText = "Registrando asistencia...";

            try {
                // Registrar en la colección "asistencias"
                await addDoc(collection(db, "asistencias"), {
                    usuarioId: decodedText,
                    timestamp: new Date()
                });
                
                resultadoDiv.style.backgroundColor = "#d4edda";
                resultadoDiv.style.color = "#155724";
                resultadoDiv.innerText = "¡Asistencia registrada con éxito!";
                
                // Limpiar el estado después de 3 segundos para el próximo usuario
                setTimeout(() => { 
                    lastScan = ""; 
                    resultadoDiv.style.backgroundColor = "transparent";
                    resultadoDiv.style.color = "#333";
                    resultadoDiv.innerText = "Esperando siguiente escaneo...";
                }, 3000);

            } catch (e) {
                console.error("Error al registrar:", e);
                resultadoDiv.style.backgroundColor = "#f8d7da";
                resultadoDiv.style.color = "#721c24";
                resultadoDiv.innerText = "Error al conectar con Firebase.";
                lastScan = "";
            }
        }

        // Configuración e inicio automático del escáner
        function iniciarEscaner() {
            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 10, 
                    qrbox: { width: 250, height: 250 },
                    rememberLastUsedCamera: true
                }, 
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, (error) => {
                // Se ignoran errores de búsqueda continua de QR para no saturar la consola
            });
        }

        // Ejecutar el escáner al cargar la página
        window.addEventListener('DOMContentLoaded', iniciarEscaner);
    </script>
</body>
</html>
