<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Generar QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #qr-code { margin-top: 20px; display: flex; justify-content: center; }
        nav { margin-bottom: 20px; text-align: center; }
        nav a { margin: 0 15px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Ir al Escáner</a>
            <a href="informes.html">Ver Informes</a>
        </nav>
        <h2>Registrar Persona y Generar QR</h2>
        <input type="text" id="nombre" placeholder="Nombre completo" required>
        <input type="text" id="departamento" placeholder="Departamento o Puesto" required>
        <button id="btn-guardar">Guardar y Generar QR</button>

        <div id="mensaje"></div>
        <div id="qr-code"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // === PEGA AQUÍ TUS CREDENCIALES REALES DE FIREBASE ===
        const firebaseConfig = {
		apiKey: "AIzaSyCFFZvpTY292Ilq_vCGaSFOk4MNQersDtg",
  authDomain: "asistenciabifml.firebaseapp.com",
  databaseURL: "https://asistenciabifml-default-rtdb.firebaseio.com",
  projectId: "asistenciabifml",
  storageBucket: "asistenciabifml.firebasestorage.app",
  messagingSenderId: "831773431166",
  appId: "1:831773431166:web:90c37497734c43a84e8f2f",
  measurementId: "G-VVG07BDQGH"
        };

        // Inicializar Firebase y la Base de Datos
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lógica del botón guardar
        document.getElementById('btn-guardar').addEventListener('click', async () => {
            const nombre = document.getElementById('nombre').value;
            const departamento = document.getElementById('departamento').value;
            const mensajeDiv = document.getElementById('mensaje');
            const qrDiv = document.getElementById('qr-code');

            if(!nombre || !departamento) {
                mensajeDiv.innerHTML = "<p style='color:red; font-weight:bold;'>⚠️ Completa todos los campos.</p>";
                return;
            }

            mensajeDiv.innerHTML = "<p style='color:orange;'>Procesando...</p>";

            try {
                // 1. Guardar directamente en la colección "usuarios" de Firestore
                const docRef = await addDoc(collection(db, "usuarios"), {
                    nombre: nombre,
                    departamento: departamento,
                    fechaRegistro: new Date()
                });

                mensajeDiv.innerHTML = `<p style='color:green; font-weight:bold;'>✅ Guardado exitosamente en Firebase.</p>`;
                
                // 2. Generar el código QR usando el ID único otorgado por Firebase
                qrDiv.innerHTML = ""; 
                new QRCode(qrDiv, {
                    text: docRef.id,
                    width: 200,
                    height: 200
                });

                // Limpiar cajas de texto
                document.getElementById('nombre').value = '';
                document.getElementById('departamento').value = '';

            } catch (e) {
                console.error("Error detallado:", e);
                mensajeDiv.innerHTML = `<p style='color:red; font-weight:bold;'>❌ Error al conectar con Firebase: ${e.message}</p>`;
            }
        });
    </script>
</body>
</html>
