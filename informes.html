<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes de Asistencia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        nav { margin-bottom: 20px; text-align: center; }
        nav a { margin: 0 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        .btn-accion { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; display: inline-block; }
        .btn-accion:hover { background-color: #218838; }
        .btn-eliminar { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-eliminar:hover { background-color: #bd2130; }
        .cargando { text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Ir al Escáner</a>
            <a href="admin.html">Agregar Usuarios</a>
        </nav>
        
        <div id="contenido-reporte">
            <h2>Reporte de Asistencias Online</h2>
            <table id="tabla-asistencias">
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Nombre</th>
                        <th>Departamento / Puesto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan='4' class="cargando" id="estado-tabla">Cargando datos en tiempo real...</td></tr>
                </tbody>
            </table>
        </div>

        <button id="btn-descargar-pdf" class="btn-accion">📄 Descargar Reporte en PDF</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // === TU CONFIGURACIÓN DE FIREBASE ===
        const firebaseConfig = {
          apiKey: "AIzaSyCFFZvpTY292Ilq_vCGaSFOk4MNQersDtg",
  authDomain: "asistenciabifml.firebaseapp.com",
  databaseURL: "https://asistenciabifml-default-rtdb.firebaseio.com",
  projectId: "asistenciabifml",
  storageBucket: "asistenciabifml.firebasestorage.app",
  messagingSenderId: "831773431166",
  appId: "1:831773431166:web:90c37497734c43a84e8f2f",
  measurementId: "G-VVG07BDQGH"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            const tbody = document.querySelector("#tabla-asistencias tbody");
            const q = query(collection(db, "asistencias"), orderBy("timestamp", "desc"));

            onSnapshot(q, (querySnapshot) => {
                tbody.innerHTML = "";
                
                if (querySnapshot.empty) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No hay asistencias registradas.</td></tr>";
                    return;
                }

                querySnapshot.forEach((documento) => {
                    try {
                        const data = documento.data();
                        let fechaLegible = "Sin fecha";
                        
                        if (data.timestamp) {
                            if (typeof data.timestamp.toDate === 'function') {
                                fechaLegible = data.timestamp.toDate().toLocaleString('es-GT');
                            } else {
                                fechaLegible = new Date(data.timestamp).toLocaleString('es-GT');
                            }
                        }
                        
                        // Jalar las nuevas variables de Nombre y Departamento de la asistencia
                        const nombre = data.nombre || "ID: " + data.usuarioId;
                        const departamento = data.departamento || "No especificado";

                        tbody.innerHTML += `
                            <tr>
                                <td>${fechaLegible}</td>
                                <td><strong>${nombre}</strong></td>
                                <td>${departamento}</td>
                                <td>
                                    <button class="btn-eliminar" data-id="${documento.id}">❌ Eliminar</button>
                                </td>
                            </tr>`;
                    } catch (errInner) {
                        console.error("Error individual:", errInner);
                    }
                });

                // Funcionalidad de eliminar
                document.querySelectorAll('.btn-eliminar').forEach(boton => {
                    boton.onclick = async (e) => {
                        const idDocumento = e.target.getAttribute('data-id');
                        if (confirm("¿Estás seguro de que deseas eliminar este registro?")) {
                            try {
                                await deleteDoc(doc(db, "asistencias", idDocumento));
                            } catch (error) {
                                alert("No se pudo eliminar.");
                            }
                        }
                    };
                });

            }, (error) => {
                document.getElementById("estado-tabla").innerText = "Error: " + error.message;
            });

        } catch (errGlobal) {
            console.error(errGlobal);
        }

        // Lógica PDF
        document.getElementById('btn-descargar-pdf').addEventListener('click', () => {
            const elemento = document.getElementById('contenido-reporte');
            const botonesEliminar = document.querySelectorAll('.btn-eliminar');
            botonesEliminar.forEach(b => b.style.display = 'none');

            const opciones = {
                margin: 0.5,
                filename: `Reporte_Asistencias_${new Date().toISOString().slice(0,10)}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            html2pdf().set(opciones).from(elemento).save().then(() => {
                botonesEliminar.forEach(b => b.style.display = 'inline-block');
            });
        });
    </script>
</body>
</html>
