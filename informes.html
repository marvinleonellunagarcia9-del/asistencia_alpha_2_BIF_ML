<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes de Asistencia</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: blue; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Ir al Escáner</a>
        <a href="admin.html">Agregar Usuarios</a>
    </nav>
    
    <h2>Reporte de Asistencias</h2>
    <table id="tabla-asistencias">
        <thead>
            <tr>
                <th>Fecha y Hora</th>
                <th>ID de Usuario (QR)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        async function cargarInformes() {
            const tbody = document.querySelector("#tabla-asistencias tbody");
            tbody.innerHTML = "<tr><td colspan='2'>Cargando datos...</td></tr>";

            try {
                // Consultar asistencias ordenadas por fecha
                const q = query(collection(db, "asistencias"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                tbody.innerHTML = ""; // Limpiar loading

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const fecha = data.timestamp.toDate().toLocaleString(); // Convertir a fecha legible
                    const fila = `<tr>
                        <td>${fecha}</td>
                        <td>${data.usuarioId}</td>
                    </tr>`;
                    tbody.innerHTML += fila;
                });

            } catch (e) {
                console.error("Error al cargar informes: ", e);
                tbody.innerHTML = "<tr><td colspan='2' style='color:red'>Error al cargar los datos.</td></tr>";
            }
        }

        cargarInformes();
    </script>
</body>
</html>
