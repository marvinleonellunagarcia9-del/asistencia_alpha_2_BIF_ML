<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes de Asistencia</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        nav { margin-bottom: 20px; text-align: center; }
        nav a { margin: 0 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        .cargando { text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Ir al Escáner</a>
            <a href="admin.html">Agregar Usuarios</a>
        </nav>
        
        <h2>Reporte de Asistencias</h2>
        <table id="tabla-asistencias">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>ID de Usuario (Código QR)</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan='2' class="cargando">Cargando datos desde Firebase...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // === PEGA AQUÍ TUS MISMAS CREDENCIALES REALES DE FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyCFFZvpTY292Ilq_vCGaSFOk4MNQersDtg",
  authDomain: "asistenciabifml.firebaseapp.com",
  databaseURL: "https://asistenciabifml-default-rtdb.firebaseio.com",
  projectId: "asistenciabifml",
  storageBucket: "asistenciabifml.firebasestorage.app",
  messagingSenderId: "831773431166",
  appId: "1:831773431166:web:90c37497734c43a84e8f2f",
  measurementId: "G-VVG07BDQGH"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarInformes() {
            const tbody = document.querySelector("#tabla-asistencias tbody");

            try {
                // Consultar asistencias ordenadas de la más reciente a la más antigua
                const q = query(collection(db, "asistencias"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                tbody.innerHTML = ""; // Limpiar el mensaje de "Cargando..."

                if (querySnapshot.empty) {
                    tbody.innerHTML = "<tr><td colspan='2' style='text-align:center;'>No hay asistencias registradas aún.</td></tr>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Convertir el formato de tiempo de Firebase a una fecha y hora normal
                    let fechaLegible = "Fecha desconocida";
                    if (data.timestamp) {
                        fechaLegible = data.timestamp.toDate().toLocaleString('es-ES', { 
                            dateStyle: 'medium', 
                            timeStyle: 'medium' 
                        });
                    }
                    
                    const fila = `<tr>
                        <td>${fechaLegible}</td>
                        <td>${data.usuarioId}</td>
                    </tr>`;
                    tbody.innerHTML += fila;
                });

            } catch (e) {
                console.error("Error al cargar informes: ", e);
                tbody.innerHTML = `<tr><td colspan='2' style='color:red; text-align:center;'>Error al conectar con Firebase: ${e.message}</td></tr>`;
            }
        }

        // Ejecutar la carga de datos en cuanto abre la página
        cargarInformes();
    </script>
</body>
</html>
